[package]
name = "noop-agent"
version = "0.1.7"
edition.workspace = true
license.workspace = true
publish.workspace = true

# the installed name on a machine
[[bin]]
name = "noop"
path = "src/main.rs"

[dependencies]
noop-core = { path = "../noop-core" }
async-trait = { version = "0.1", optional = true }
copilot-sdk = { version = "2.0.4-preview.2", default-features = false, features = ["runtime"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
toml = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
noop-server = { path = "../noop-server" }
rusqlite = { version = "0.43", features = ["bundled"] }

[features]
default = ["copilot"]
# the agent runner; `--no-default-features` builds a sync-only noop
copilot = ["dep:copilot-sdk", "dep:async-trait"]
