[package]
name = "noop-server"
version = "0.1.7"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = "0.4.45"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }
multer = "3.1.0"
noop-core = { path = "../noop-core" }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
qrcode = { version = "0.15.0", default-features = false }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
